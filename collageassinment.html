<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 20px;
        }
        form {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        p.desc {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
        fieldset {
            margin-bottom: 20px;
            padding: 15px 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        legend {
            font-weight: bold;
            color: #0056b3;
            padding: 0 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .inline-options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 5px;
        }
        .inline-options label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button[type="submit"] {
            background-color: #28a745;
            color: white;
        }
        button[type="submit"]:hover {
            background-color: #218838;
        }
        button[type="reset"] {
            background-color: #dc3545;
            color: white;
        }
        button[type="reset"]:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <form action="#" method="POST" enctype="multipart/form-data">
        <!-- Task 1: Heading and Description -->
        <h2>College Admission Registration Form</h2>
        <p class="desc">Please fill out the form accurately to apply for your desired course.</p>

        <!-- Bonus Challenge & Task 2, 3: Personal Information Group -->
        <fieldset>
            <legend>Personal Information</legend>
            
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required minlength="3" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Create a secure password">
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <div class="inline-options">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>
        </fieldset>

        <!-- Bonus Challenge & Task 4, 5, 6, 7: Academic Details & Preferences Group -->
        <fieldset>
            <legend>Academic Details & Preferences</legend>

            <div class="form-group">
                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="btech_cse">B.Tech CSE</option>
                    <option value="btech_aiml">B.Tech AI/ML</option>
                    <option value="bba">BBA</option>
                    <option value="bca">BCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Interests:</label>
                <div class="inline-options">
                    <label><input type="checkbox" name="interests" value="coding"> Coding</label>
                    <label><input type="checkbox" name="interests" value="sports"> Sports</label>
                    <label><input type="checkbox" name="interests" value="music"> Music</label>
                    <label><input type="checkbox" name="interests" value="reading"> Reading</label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" name="address" required placeholder="Enter your residential address"></textarea>
            </div>

            <div class="form-group">
                <label for="photo">Upload Photograph:</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="documents">Supporting Documents:</label>
                <input type="file" id="documents" name="documents" accept=".pdf,.doc,.docx" required>
            </div>
        </fieldset>

        <!-- Bonus Challenge & Task 8, 9: Declaration and Buttons Group -->
        <fieldset>
            <legend>Declaration & Submission</legend>
            
            <div class="form-group">
                <label style="font-weight: normal; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="declaration" required> I hereby declare that all the information provided above is true and correct.
                </label>
            </div>

            <div class="btn-container">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </fieldset>

    </form>

</body>
</html>
